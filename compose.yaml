services:
  authoring:
    profiles: [authoring]
    build:
      context: .
      target: authoring
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      DATABASE_URL: postgres://patchcraft:patchcraft-local@database:5432/patchcraft
      AUTHORING_ORIGINS: ${AUTHORING_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./server:/app/server:ro
      - ./src:/app/src:ro
  database:
    profiles: [authoring, test]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: patchcraft
      POSTGRES_PASSWORD: patchcraft-local
      POSTGRES_DB: patchcraft
    volumes:
      - authoring-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchcraft"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    environment:
      AUTHORING_PROXY: http://authoring:3001
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:${PATCHCRAFT_PORT:-5173}:5173"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vision.html:/app/vision.html:ro
      - ./visual-lab.html:/app/visual-lab.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
  tests:
    environment:
      PATCHCRAFT_BUILD_SHA: ${PATCHCRAFT_BUILD_SHA:-}
      PATCHCRAFT_RELEASE_TAG: ${PATCHCRAFT_RELEASE_TAG:-}
      DATABASE_URL: postgres://patchcraft:patchcraft-local@database:5432/patchcraft
    depends_on:
      database:
        condition: service_healthy
    build:
      context: .
      target: tests
    profiles: [test]
    init: true
    shm_size: 256mb
    command: ["npm", "test"]

volumes:
  authoring-data:
