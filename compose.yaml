services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PATCHCRAFT_PORT:-5173}:5173"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
  tests:
    build: .
    profiles: [test]
    init: true
    shm_size: 256mb
    command: ["npm", "test"]
