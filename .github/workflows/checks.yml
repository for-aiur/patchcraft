name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy the selected commit to the staging alias
        type: choice
        options: [staging]
        required: true
        default: staging
  release:
    types: [published]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PATCHCRAFT_BUILD_SHA: ${{ github.sha }}
      PATCHCRAFT_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose build tests
      - name: Type check, production build, unit and browser tests
        run: docker compose run -T --name patchcraft-ci-tests tests
      - name: Extract tested static build
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging')
        run: docker cp patchcraft-ci-tests:/app/dist ./dist
      - name: Save tested static build
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging')
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Clean up
        if: always()
        run: |
          docker rm -f patchcraft-ci-tests || true
          docker compose down --volumes

  deploy-staging:
    name: Deploy staging preview
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: https://stage.patchcraft.pages.dev/visual-lab
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository or preview environment secrets.'
            exit 1
          fi
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/patchcraft"
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/pages-project.json" -w '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project_url")
          if [ "$status" = '404' ]; then
            status=$(curl --silent --show-error -o "$RUNNER_TEMP/pages-project-create.json" -w '%{http_code}' \
              --request POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"name":"patchcraft","production_branch":"main"}')
            if [ "$status" != '200' ]; then cat "$RUNNER_TEMP/pages-project-create.json"; exit 1; fi
            jq -e '.success == true' "$RUNNER_TEMP/pages-project-create.json" >/dev/null
          elif [ "$status" != '200' ]; then
            cat "$RUNNER_TEMP/pages-project.json"
            exit 1
          else
            jq -e '.success == true' "$RUNNER_TEMP/pages-project.json" >/dev/null
          fi
      - name: Download tested static build
        uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy tested branch build
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: pages deploy dist --project-name patchcraft --branch stage --commit-dirty=true
      - name: Verify preview
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.pages-deployment-alias-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          for route in / /visual-lab /about.html /support.html; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "$DEPLOYMENT_URL$route" -o /dev/null
          done
          echo "Feature preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Cloudflare Pages
    needs: tests
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://patchcraft.pages.dev/visual-lab
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository or production environment secrets. See docs/deployment.md.'
            exit 1
          fi
      - name: Download tested static build
        uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy tested build
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: pages deploy dist --project-name patchcraft --branch main --commit-dirty=true
      - name: Verify deployment
        env:
          DEPLOYMENT_URL: https://patchcraft.pages.dev
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "$DEPLOYMENT_URL/visual-lab" -o /tmp/visual-lab.html
          asset=$(sed -n 's/.*src="\([^"]*visualLab-[^"]*\.js\)".*/\1/p' /tmp/visual-lab.html)
          test -n "$asset"
          grep -F "$asset" dist/visual-lab.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$DEPLOYMENT_URL$asset" -o /dev/null
          echo "Deployed $GITHUB_SHA: $DEPLOYMENT_URL/visual-lab" >> "$GITHUB_STEP_SUMMARY"
